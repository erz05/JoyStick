<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Flat Background (Dark Charcoal) -->
  <rect width="512" height="512" rx="128" fill="#18181B"/>

  <!-- ARCADE CONTROL PLATE (Centered at 256, 256) -->
  <!-- Main Plate Body -->
  <rect x="126" y="126" width="260" height="260" rx="28" fill="#1E293B" stroke="#334155" stroke-width="8"/>

  <!-- Retro Color Stripes on Plate -->
  <rect x="130" y="166" width="252" height="16" fill="#F43F5E"/>
  <rect x="130" y="186" width="252" height="16" fill="#3B82F6"/>

  <!-- Plate Mounting Screws (4 corners symmetric around center) -->
  <!-- Top-Left -->
  <circle cx="158" cy="158" r="10" fill="#475569" stroke="#64748B" stroke-width="3"/>
  <line x1="151" y1="151" x2="165" y2="165" stroke="#334155" stroke-width="3"/>
  <!-- Top-Right -->
  <circle cx="354" cy="158" r="10" fill="#475569" stroke="#64748B" stroke-width="3"/>
  <line x1="347" y1="151" x2="361" y2="165" stroke="#334155" stroke-width="3"/>
  <!-- Bottom-Left -->
  <circle cx="158" cy="354" r="10" fill="#475569" stroke="#64748B" stroke-width="3"/>
  <line x1="151" y1="347" x2="165" y2="361" stroke="#334155" stroke-width="3"/>
  <!-- Bottom-Right -->
  <circle cx="354" cy="354" r="10" fill="#475569" stroke="#64748B" stroke-width="3"/>
  <line x1="347" y1="347" x2="361" y2="361" stroke="#334155" stroke-width="3"/>

  <!-- Joystick Center Slot / Ring -->
  <circle cx="256" cy="256" r="64" fill="#0B0F19" stroke="#38BDF8" stroke-width="6"/>

  <!-- Direction Arrow Indicators -->
  <!-- UP Arrow -->
  <polygon points="256,164 266,178 246,178" fill="#38BDF8"/>
  <!-- DOWN Arrow -->
  <polygon points="256,348 266,334 246,334" fill="#38BDF8"/>
  <!-- LEFT Arrow -->
  <polygon points="164,256 178,246 178,266" fill="#38BDF8"/>
  <!-- RIGHT Arrow -->
  <polygon points="348,256 334,246 334,266" fill="#38BDF8"/>

  <!-- Pivot Disc Base -->
  <circle cx="256" cy="256" r="32" fill="#0F172A" stroke="#475569" stroke-width="4"/>
  <circle cx="256" cy="256" r="20" fill="#334155"/>

  <!-- JOYSTICK STICK / SHAFT -->
  <!-- Dark Shadow Side of Stick -->
  <line x1="256" y1="256" x2="310" y2="146" stroke="#94A3B8" stroke-width="24" stroke-linecap="round"/>
  <!-- Light Highlight Side of Stick (offset left) -->
  <line x1="252" y1="258" x2="306" y2="148" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round"/>

  <!-- JOYSTICK BALL KNOB -->
  <!-- 3D Flat Shading (Shadow Under-layer) -->
  <circle cx="310" cy="146" r="54" fill="#991B1B"/>
  <!-- 3D Flat Shading (Main Upper-layer) -->
  <circle cx="304" cy="140" r="54" fill="#EF4444"/>
  <!-- Highlight Glare Spot -->
  <circle cx="288" cy="124" r="16" fill="#FCA5A5"/>
  <circle cx="282" cy="118" r="6" fill="#FFFFFF"/>
</svg>
